version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      expo-sdk:
        applies-to: "version-updates"
        patterns:
          - "@expo/*"
          - "@react-native/*"
          - "expo"
          - "expo-*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
      tanstack-query:
        applies-to: "version-updates"
        patterns:
          - "@tanstack/*"
